<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 30px; }
    .player-box {
      position: relative;
      width: 400px;
      height: 220px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 2px solid #333;
    }
    #yt-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    .curtain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #181824;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none; /* Allows clicks to go through if needed, or we can use JS */
    }
    .curtain.hidden {
      display: none;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
    }
  </style>
</head>
<body>
  <h2>Teste de Reprodução com Cortina Anti-Spoiler</h2>
  
  <div class="player-box">
    <!-- Iframe of normal size (>= 30px) -->
    <iframe id="yt-frame" allow="autoplay; encrypted-media"></iframe>
    
    <!-- Blind Curtain Overlay -->
    <div class="curtain" id="curtain">
      <div style="font-size: 40px; margin-bottom: 8px;">🎧</div>
      <div style="font-size: 16px; font-weight: bold; color: #a5b4fc;">Modo Blind Test Ativo</div>
      <div style="font-size: 12px; color: #888;">Vídeo e título ocultos</div>
    </div>
  </div>

  <div>
    <button onclick="playAudio('tkNfLYr-MyM')" style="background: #6366f1; color: #fff; border: none;">
      ▶️ Tocar Áudio (InuYasha)
    </button>
    <button onclick="playAudio('RiQrbSuLrsU')" style="background: #10b981; color: #fff; border: none;">
      ▶️ Tocar Áudio (Naruto)
    </button>
    <button onclick="toggleCurtain()" style="background: #f59e0b; color: #000; border: none;">
      👁️ Revelar Vídeo
    </button>
  </div>

  <script>
    function playAudio(vidId) {
      const frame = document.getElementById('yt-frame');
      // Set src with autoplay=1 in direct response to user click
      frame.src = 'https://www.youtube.com/embed/' + vidId + '?autoplay=1&enablejsapi=1';
    }

    function toggleCurtain() {
      const curtain = document.getElementById('curtain');
      curtain.classList.toggle('hidden');
    }
  </script>
</body>
</html>
